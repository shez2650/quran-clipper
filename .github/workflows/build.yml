name: Build

# Every push: tests + Android build.
# Tags like v1.2.0 (or a manual run): also macOS and Windows, and tags publish
# all three as a GitHub Release. Desktop builds are skipped on plain pushes
# because macOS minutes are expensive on private repos.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: flutter build apk --release --target-platform android-arm64 --build-number ${{ github.run_number }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Only a build signed with the release key goes into a release, so it can
      # install over earlier versions. Without the secrets it's just a check.
      - name: Name APK
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            mv build/app/outputs/flutter-apk/app-release.apk QuranClipper-android.apk
          else
            mv build/app/outputs/flutter-apk/app-release.apk ci-debug-signed-android.apk
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: '*.apk'

  macos:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build macos --release --build-number ${{ github.run_number }}
      - name: Zip app
        run: |
          APP="build/macos/Build/Products/Release/Quran Clipper.app"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" QuranClipper-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: QuranClipper-macos.zip

  windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build windows --release --build-number ${{ github.run_number }}
      - name: Zip app
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force -Path "dist/Quran Clipper" | Out-Null
          Copy-Item -Recurse "$out/*" "dist/Quran Clipper/"
          Compress-Archive -Path "dist/Quran Clipper" -DestinationPath QuranClipper-windows.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: QuranClipper-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            QuranClipper-android.apk
            QuranClipper-macos.zip
            QuranClipper-windows.zip
          overwrite_files: true
