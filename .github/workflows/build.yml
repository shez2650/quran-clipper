name: Build

# main: tests + Android. windows-v* tags: tests + Windows-only release.
# Tags like v1.2.0 (or a manual run): also macOS and Windows. On a tag each
# platform attaches its own build to the GitHub Release as soon as it's done,
# so one slow or stuck platform doesn't hold up the others. Desktop builds are skipped on plain pushes
# because macOS minutes are expensive on private repos.
on:
  push:
    branches: [main, 'codex/windows-youtube-bundle']
    tags: ['v*', 'windows-v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: flutter build apk --release --target-platform android-arm64 --build-number ${{ github.run_number }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Only a build signed with the release key goes into a release, so it can
      # install over earlier versions. Without the secrets it's just a check.
      - name: Name APK
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            mv build/app/outputs/flutter-apk/app-release.apk QuranClipper-android.apk
          else
            mv build/app/outputs/flutter-apk/app-release.apk ci-debug-signed-android.apk
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: '*.apk'
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('QuranClipper-android.apk') != ''
        uses: softprops/action-gh-release@v3
        with:
          files: QuranClipper-android.apk
          overwrite_files: true

  macos:
    needs: test
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # Intel runners: Apple Silicon ones are often too busy to pick the job up.
    # The app is built universal (arm64 + x86_64) either way.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Runs the export code through the FFmpeg bundled with the app.
      - run: flutter test integration_test -d macos
      - run: flutter build macos --release --build-number ${{ github.run_number }}
      - name: Zip app
        run: |
          APP="build/macos/Build/Products/Release/Quran Clipper.app"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" QuranClipper-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: QuranClipper-macos.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: QuranClipper-macos.zip
          overwrite_files: true

  windows:
    needs: test
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/windows-v') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/codex/windows-youtube-bundle'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Runs the export code through the FFmpeg bundled with the app.
      - run: flutter test test/downloader_test.dart test/import_test.dart
      - run: flutter test integration_test -d windows
      - run: flutter build windows --release --build-number ${{ github.run_number }}
      - name: Bundle pinned YouTube dependencies
        shell: pwsh
        run: ./tool/bundle_windows_downloader.ps1 -Destination build/windows/x64/runner/Release
      - name: Zip app
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force -Path "dist/Quran Clipper" | Out-Null
          Copy-Item -Recurse "$out/*" "dist/Quran Clipper/"
          Compress-Archive -Path "dist/Quran Clipper" -DestinationPath QuranClipper-windows.zip
      - name: Verify extracted ZIP without system downloader
        shell: pwsh
        run: |
          dart compile exe tool/windows_downloader_smoke.dart -o windows_downloader_smoke.exe
          if ($LASTEXITCODE -ne 0) { throw 'Smoke harness compilation failed' }
          Expand-Archive QuranClipper-windows.zip -DestinationPath package-check
          $app = (Resolve-Path 'package-check/Quran Clipper').Path
          Copy-Item windows_downloader_smoke.exe $app
          $oldPath = $env:PATH
          $oldLocal = $env:LOCALAPPDATA
          try {
            $env:PATH = "$env:SystemRoot/System32"
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'empty-local-appdata'
            Push-Location $env:RUNNER_TEMP
            try {
              & (Join-Path $app 'windows_downloader_smoke.exe') --live
              if ($LASTEXITCODE -ne 0) { throw 'Packaged downloader smoke failed' }
              Copy-Item windows-downloader-smoke.json $env:GITHUB_WORKSPACE
              $process = Start-Process (Join-Path $app 'QuranClipper.exe') -PassThru -WindowStyle Hidden
              Start-Sleep -Seconds 5
              if ($process.HasExited) { throw "Packaged app exited early: $($process.ExitCode)" }
              Stop-Process -Id $process.Id
            } finally { Pop-Location }
          } finally {
            $env:PATH = $oldPath
            $env:LOCALAPPDATA = $oldLocal
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-downloader-verification
          path: windows-downloader-smoke.json
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: QuranClipper-windows.zip
      - name: Require successful live download for Windows release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        run: |
          $report = Get-Content windows-downloader-smoke.json -Raw | ConvertFrom-Json
          if ($report.liveDownload -ne 'passed') { throw 'Live YouTube verification failed; release will not be published.' }
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v3
        with:
          name: Quran Clipper ${{ github.ref_name }}
          body_path: docs/windows-release-notes.md
          files: QuranClipper-windows.zip
          overwrite_files: true
